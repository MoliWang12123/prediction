<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>大学生英语四六级全流程备考打卡与效果预测工具</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="hero">
    <div>
      <p class="eyebrow">学习分析与智能规划</p>
      <h1>英语四六级全流程备考打卡与效果预测工具</h1>
      <p>围绕“目标设定—水平诊断—备考打卡—效果预测—复习建议”建立闭环，为学生提供可执行的备考管理方案。</p>
    </div>
    <div class="score-card"><span>预测总分</span><strong id="predictedScore">--</strong><small id="passText">等待输入数据</small></div>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>水平诊断</h2>
      <div class="form-grid">
        <label>考试类型<select id="exam"><option>CET-4 四级</option><option>CET-6 六级</option></select></label>
        <label>目标分数<input id="target" type="number" value="500" min="425" max="710"></label>
        <label>听力当前估分<input id="listening" type="number" value="135" min="0" max="249"></label>
        <label>阅读当前估分<input id="reading" type="number" value="150" min="0" max="249"></label>
        <label>写作当前估分<input id="writing" type="number" value="85" min="0" max="106"></label>
        <label>翻译当前估分<input id="translation" type="number" value="82" min="0" max="106"></label>
        <label>剩余备考天数<input id="days" type="number" value="45" min="1" max="365"></label>
        <label>每日学习时长（分钟）<input id="minutes" type="number" value="90" min="20" max="360"></label>
      </div>
      <button class="primary" id="predictBtn">生成预测与计划</button>
    </section>

    <section class="panel">
      <h2>预测结果</h2>
      <div id="advice" class="empty">输入基础数据后点击“生成预测与计划”。</div>
      <canvas id="chart" width="760" height="360" aria-label="分项能力图"></canvas>
    </section>
  </main>

  <section class="panel check-panel">
    <div class="title-row"><h2>备考打卡</h2><button id="reset">清除打卡</button></div>
    <div class="check-grid">
      <label><input type="checkbox" value="听力精听30分钟"> 听力精听30分钟</label>
      <label><input type="checkbox" value="阅读真题2篇"> 阅读真题2篇</label>
      <label><input type="checkbox" value="作文模板复盘"> 作文模板复盘</label>
      <label><input type="checkbox" value="翻译句型积累"> 翻译句型积累</label>
      <label><input type="checkbox" value="单词复习100个"> 单词复习100个</label>
    </div>
    <button id="saveCheck">保存今日打卡</button>
    <div id="history" class="history"></div>
  </section>

  <footer>说明：预测模型用于学习规划参考，不替代真实考试成绩。数据保存在本地浏览器中。</footer>
  <script src="app.js"></script>
</body>
</html>
